name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      app_variant:
        description: 'Application configuration to build'
        required: true
        default: cakewallet
        type: choice
        options:
          - cakewallet
          - monero.com
      bundle_id:
        description: 'Unique Bundle ID for the sideloaded app'
        required: true
        default: com.test.cakewallet

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Set up build tools
        run: |
          set -euxo pipefail
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          brew install automake ccache cmake cocoapods go libtool pkg-config xz
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          xcrun --sdk iphoneos --show-sdk-path
          xcodebuild -version
          flutter --version
          pod --version
          go version

      - name: Set up Rust targets
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-apple-ios
          rustc --version
          cargo --version

      - name: Set up Go mobile bindings
        run: |
          set -euxo pipefail
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/go/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          gomobile version

      - name: Make repository scripts executable
        run: |
          set -euxo pipefail
          find scripts -type f -name '*.sh' -exec chmod +x {} +
          chmod +x model_generator.sh compile_graphics.sh gen_android_manifest.sh

      - name: Prepare path dependencies
        run: |
          set -euxo pipefail
          bash scripts/prepare_torch.sh
          pushd scripts
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/cake-tech/reown_flutter/releases/download/v0.0.4/reown_flutter-v0.0.4.tar.gz \
            --output reown_flutter.tar.gz
          rm -rf reown_flutter
          mkdir reown_flutter
          tar -xzf reown_flutter.tar.gz -C reown_flutter
          rm reown_flutter.tar.gz
          test -f reown_flutter/packages/reown_walletkit/pubspec.yaml
          bash build_bitbox_flutter.sh
          popd

      - name: Configure Cake Wallet sources
        env:
          APP_VARIANT: ${{ inputs.app_variant }}
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euxo pipefail
          pushd scripts/ios
          source ./app_env.sh "$APP_VARIANT"
          export APP_IOS_BUNDLE_ID="$CUSTOM_BUNDLE_ID"
          bash ./app_config.sh
          popd

      - name: Build native iOS libraries
        env:
          APP_VARIANT: ${{ inputs.app_variant }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/go/bin:$PATH"
          pushd scripts/ios
          source ./app_env.sh "$APP_VARIANT"
          bash ./build_all.sh
          popd
          bash scripts/ios/build_zcash.sh

      - name: Generate Flutter sources
        run: |
          set -euxo pipefail
          flutter pub get
          dart run tool/generate_new_secrets.dart
          dart run tool/generate_localization.dart
          bash ./model_generator.sh
          bash ./compile_graphics.sh

      - name: Install CocoaPods dependencies
        run: |
          set -euxo pipefail
          pushd ios
          pod install --repo-update
          popd

      - name: Build unsigned IPA for sideloading
        run: |
          set -euxo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/ios/ipa/Payload build/ios/CakeWallet-unsigned.ipa
          unzip -t build/ios/CakeWallet-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CakeWallet-unsigned-ipa
          path: build/ios/CakeWallet-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
