name: iOS IPA free
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup Xcode + deps
        run: |
          brew install automake ccache cmake cocoapods go libtool pkgconfig xz
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          flutter --version
          pod --version

      - name: Configure + build IPA (Cake Wallet)
        run: |
          set -e -x
          export PATH="$HOME/.cargo/bin:$PATH"
          chmod +x scripts/*.sh scripts/ios/*.sh ./model_generator.sh ./compile_graphics.sh ./gen_android_manifest.sh 2>/dev/null || true
          find scripts -name "*.sh" -exec chmod +x {} \;
          # 1. paczki path (gitignore je usuwa, trzeba pobrać przed pub get):
          bash scripts/prepare_torch.sh
          # reown: tarball zamiast git+generate (generate pada na Flutter 3.41.9: freezed vs dependency_validator):
          pushd scripts
            rm -rf reown_flutter reown_flutter.tar.gz
            curl -L https://github.com/cake-tech/reown_flutter/releases/download/v0.0.4/reown_flutter-v0.0.4.tar.gz -o reown_flutter.tar.gz
            mkdir reown_flutter
            tar -xzf reown_flutter.tar.gz -C reown_flutter
            rm ./reown_flutter.tar.gz
          popd
          bash scripts/build_bitbox_flutter.sh
          # 2. konfiguracja aplikacji:
          cd scripts/ios
          source ./app_env.sh cakewallet
          export APP_IOS_BUNDLE_ID="com.test.cakewallet"
          bash ./app_config.sh
          cd ../../
          # 3. natywne biblioteki iOS (oficjalna ścieżka z docs/builds/IOS.md):
          bash scripts/ios/build_torch.sh
          bash scripts/ios/build_monero_all.sh
          bash scripts/ios/build_mwebd.sh
          bash scripts/ios/build_decred.sh
          bash scripts/ios/build_zcash.sh
          # 4. flutter:
          flutter pub get
          dart run tool/generate_new_secrets.dart
          dart run tool/generate_localization.dart
          bash ./model_generator.sh
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload && cp -r Runner.app Payload/
          zip -r CakeWallet.ipa Payload
          ls -lh CakeWallet.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CakeWallet-ipa
          path: build/ios/iphoneos/CakeWallet.ipa
